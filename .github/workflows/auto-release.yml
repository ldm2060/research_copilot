name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate version from run number
        id: version
        run: |
          # Read current major.minor from package.json
          CURRENT_VERSION=$(node -p "require('./packages/cli/package.json').version")
          MAJOR_MINOR=$(echo $CURRENT_VERSION | cut -d. -f1,2)

          # Use GitHub run number as patch version
          # Format: v{major}.{minor}.{run_number}
          NEW_VERSION="$MAJOR_MINOR.${{ github.run_number }}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: v$NEW_VERSION (based on package.json $CURRENT_VERSION)"

      - name: Update package.json version
        run: |
          cd packages/cli
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
          cd ../..

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Clean old tags (keep latest 3)
        run: |
          # Get all tags sorted by version
          TAGS=$(git tag -l 'v*' --sort=-version:refname)

          # Get tags to delete (all except first 3)
          DELETE_TAGS=$(echo "$TAGS" | tail -n +4)

          # Delete old tags locally and remotely
          for tag in $DELETE_TAGS; do
            git tag -d "$tag" || true
            git push origin ":refs/tags/$tag" || true
          done
