name: Publish to npm

on:
  workflow_run:
    workflows: ["Auto Release"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Sync package.json versions with git tag
        run: |
          # workflow_run starts after Auto Release creates the tag; fetch tags explicitly.
          git fetch --tags --force
          TAG=$(git tag -l 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No release tag found"
            exit 1
          fi
          VERSION=${TAG#v}
          echo "Syncing all packages to version: $VERSION from $TAG"

          # Update version in all package.json files
          pnpm -r exec -- node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        run: |
          # Update workspace:* to actual versions for publishing
          pnpm -r exec -- node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            if (pkg.dependencies) {
              for (let dep in pkg.dependencies) {
                if (pkg.dependencies[dep] === 'workspace:*') {
                  pkg.dependencies[dep] = '^' + pkg.version;
                }
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Publish each package
          pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
