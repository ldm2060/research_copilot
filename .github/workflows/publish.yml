name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Auto Release"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Sync package.json versions with git tag
        run: |
          # Get version from latest git tag (strip 'v' prefix)
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "Syncing all packages to version: $VERSION"

          # Update version in all package.json files
          pnpm -r exec -- node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        run: |
          # Update workspace:* to actual versions for publishing
          pnpm -r exec -- node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            if (pkg.dependencies) {
              for (let dep in pkg.dependencies) {
                if (pkg.dependencies[dep] === 'workspace:*') {
                  pkg.dependencies[dep] = '^' + pkg.version;
                }
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Publish each package
          pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
