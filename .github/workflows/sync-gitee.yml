name: Sync to Gitee

on:
  push:
    branches:
      - main
      - deploy
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Sync branches and tags to Gitee
        run: |
          git remote add gitee git@gitee.com:ldm2060/research_copilot.git || true
          git push gitee main:main --force
          git push gitee deploy:deploy --force

          # Get all tags sorted by version
          TAGS=$(git tag -l 'v*' --sort=-version:refname)

          # Keep only the latest 3 tags
          KEEP_TAGS=$(echo "$TAGS" | head -n 3)

          # Delete all tags on Gitee first
          git ls-remote --tags gitee | awk '{print $2}' | sed 's|refs/tags/||' | while read tag; do
            git push gitee :refs/tags/$tag 2>/dev/null || true
          done

          # Push only the latest 3 tags
          for tag in $KEEP_TAGS; do
            git push gitee $tag --force
          done
