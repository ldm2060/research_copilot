name: Sync to Gitee

on:
  push:
    branches:
      - main
      - deploy
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Sync branches and tags to Gitee
        run: |
          git remote add gitee git@gitee.com:ldm2060/research_copilot.git || true
          git push gitee main:main --force
          git push gitee deploy:deploy --force
          git push gitee --tags --force
